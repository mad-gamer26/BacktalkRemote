plugins {
    id 'com.android.library'
}

apply from: "../shared.gradle"

dependencies {
    implementation project(':proguard')
    implementation project(':utils')
    implementation project(':brailleime')
    phoneImplementation project(':braillecommon')
    implementation project(':brailleinterfaces')
    implementation project(':brailledisplay')
    implementation project(':materialflags')
    implementation project(':materialpreference')
    // TODO: Define different dependencies for different product flavors
    wearImplementation project(':materialpreferencecompose')
    wearImplementation project(':materialtheme')
    phoneImplementation project(':quickjs')
    implementation libs.litertlm
    // Remote access: the Kotlin bindings of the native core call it through JNA, whose Android
    // package (the aar) brings its native part for each ABI.
    implementation(libs.jna) {
        artifact {
            type = 'aar'
        }
    }
    testImplementation libs.junit
    testImplementation libs.json
    testImplementation libs.robolectric
}

// Gemini settings come from local.properties, which is not committed, so each builder uses their own key.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def geminiApiKey = localProperties.getProperty('gemini.api.key', '')
def geminiModel = localProperties.getProperty('gemini.model', 'gemini-flash-latest')

android {
    namespace = "com.google.android.accessibility.talkback"
    defaultConfig {
        buildConfigField("String", "APPLICATION_ID", '"' + talkbackApplicationId + '"')
        buildConfigField("String", "GEMINI_API_KEY", '"' + geminiApiKey + '"')
        buildConfigField("String", "GEMINI_MODEL", '"' + geminiModel + '"')
        // Used by the updater to compare this build with the latest development build.
        buildConfigField("String", "COMMIT_HASH", '"' + rootProject.gitCommitHash + '"')
        buildConfigField("int", "COMMIT_COUNT", String.valueOf(rootProject.gitCommitCount))
        // The GitHub release the updater follows: "dev" for development builds, "stable" for
        // releases (./gradlew -PupdateChannel=stable ...).
        buildConfigField("String", "UPDATE_CHANNEL",
                '"' + (project.findProperty('updateChannel') ?: 'dev') + '"')
    }
    // Robolectric tests read the module's strings.
    testOptions.unitTests.includeAndroidResources = true
    buildFeatures {
        aidl = true
    }
    // The NDK the other native modules use, for the remote access core.
    ndkVersion = "27.3.13750724"
}

// Remote access: the native core in remote/ (Rust), built for each ABI with cargo-ndk, and its
// Kotlin bindings, generated with UniFFI. It needs Rust with the Android targets and cargo-ndk;
// see docs/remote-access.md.
def remoteDir = rootProject.file('remote')
def remoteJniLibs = layout.buildDirectory.dir('remoteCore/jniLibs')
def remoteKotlin = layout.buildDirectory.dir('remoteCore/kotlin')
def remoteAbis = ['armeabi-v7a', 'arm64-v8a', 'x86_64']
def cargo = System.getProperty('os.name').toLowerCase().contains('windows') ? 'cargo.exe' : 'cargo'

def buildRemoteCore = tasks.register('buildRemoteCore', Exec) {
    description = 'Builds the remote access core for Android.'
    inputs.dir(new File(remoteDir, 'core/src'))
    inputs.dir(new File(remoteDir, 'protocol/src'))
    inputs.files(new File(remoteDir, 'Cargo.toml'), new File(remoteDir, 'Cargo.lock'),
            new File(remoteDir, 'core/Cargo.toml'), new File(remoteDir, 'protocol/Cargo.toml'))
    outputs.dir(remoteJniLibs)
    workingDir remoteDir
    def ndk = androidComponents.sdkComponents.ndkDirectory
    doFirst { environment 'ANDROID_NDK_HOME', ndk.get().asFile.absolutePath }
    def targets = remoteAbis.collectMany { ['-t', it] }
    commandLine([cargo, 'ndk'] + targets + ['--platform', '26', '-o',
            remoteJniLibs.get().asFile.absolutePath, 'build', '--release',
            '-p', 'backtalk-remote-core', '--lib'])
}

def generateRemoteBindings = tasks.register('generateRemoteBindings', Exec) {
    description = 'Generates the Kotlin bindings of the remote access core.'
    dependsOn buildRemoteCore
    inputs.dir(remoteJniLibs)
    outputs.dir(remoteKotlin)
    workingDir remoteDir
    // Any of the libraries just built has the same interface.
    def library = new File(remoteDir, 'target/x86_64-linux-android/release/libbacktalk_remote.so')
    commandLine cargo, 'run', '--release', '-q', '-p', 'backtalk-remote-core', '--features',
            'bindgen', '--bin', 'uniffi-bindgen', '--', 'generate', '--library',
            library.absolutePath, '--language', 'kotlin', '--no-format', '--out-dir',
            remoteKotlin.get().asFile.absolutePath
}

android.sourceSets.main.jniLibs.srcDir(remoteJniLibs.get().asFile)
android.sourceSets.main.kotlin.srcDir(remoteKotlin.get().asFile)
tasks.named('preBuild') { dependsOn generateRemoteBindings }
