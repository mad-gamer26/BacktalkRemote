name: Build

on:
  push:
    branches: [master]
    # A tag such as v1.0.0 makes a release: the "stable" release, which release builds update from.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The full history gives the build number (the commit count) and the release notes.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Caches Gradle and validates the wrapper jar checksum.
      - uses: gradle/actions/setup-gradle@v6

      # Remote access: its native core (remote/core) is Rust, built for each Android ABI with
      # cargo-ndk during the Gradle build.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: remote

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # The core's tests build it for Linux too, where cpal's audio backend needs ALSA's headers.
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      # The protocol, the relay, keys and sealing, the reclock, and a phone and a controlling device
      # through a relay on the runner, audio included.
      - name: Test remote access
        working-directory: remote
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      # Signs builds with the same debug key as the maintainer's own builds, so that installed
      # development builds can update in place. Pull requests from forks do not get the secret,
      # so they are signed with a new debug key.
      - name: Install debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
            echo "Installed the debug keystore."
          else
            echo "No debug keystore secret, so the build uses a new debug key."
          fi

      # AGP downloads the SDK platform and NDK it needs if the runner lacks them.
      # Backtalk Remote's release key, when the repository has it: then every build, development
      # and stable, is signed with it, and each updates the others.
      - name: Install the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.BACKTALK_REMOTE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BACKTALK_REMOTE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BACKTALK_REMOTE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BACKTALK_REMOTE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            {
              echo "BACKTALK_REMOTE_KEYSTORE=$RUNNER_TEMP/release.jks"
              echo "BACKTALK_REMOTE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "BACKTALK_REMOTE_KEY_ALIAS=$KEY_ALIAS"
              echo "BACKTALK_REMOTE_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing with the release key."
          else
            echo "No release key, so the build uses the debug key."
          fi

      - name: Build debug APKs
        run: |
          channel=dev
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            channel=stable
          fi
          ./gradlew assembleDebug -PupdateChannel=$channel --console=plain

      # Only the phone flavor: the watch's braille keyboard is a stub, so the braille keyboard's
      # tests don't compile for it, and the rest of the code is shared.
      - name: Run unit tests
        run: ./gradlew testPhoneDebugUnitTest --console=plain

      # The app's lint also checks the library modules. Issues already in lint-baseline.xml are
      # allowed, so this fails only on new errors, such as a call that needs a newer Android than
      # minSdk without a version check.
      - name: Run lint
        run: ./gradlew :lintPhoneDebug --console=plain

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            build/reports/lint-results-phoneDebug.html

      - uses: actions/upload-artifact@v7
        with:
          name: apks
          path: build/outputs/apk/**/*.apk
          if-no-files-found: error

  # Replaces the rolling "dev" pre-release that the in-app updater checks. The first line of the
  # notes is "build: <commit count>", and each later line is "- <short hash> <subject>", newest
  # first. The "latest" pre-release stays frozen on the last build with the old app ID,
  # com.android.talkback, which moves people on older builds to this one with their settings.
  publish:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: apks
          path: apks

      - name: Publish development build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          offset=$(awk '/^def buildNumberOffset = /{print $4}' version.gradle)
          count=$(( $(git rev-list --count HEAD) + offset ))
          hash=$(git rev-parse HEAD)
          short=${hash:0:7}
          {
            echo "build: $count"
            echo
            # %H cut to 7 characters, since %h can be longer when a short hash is ambiguous.
            git log -n 50 --format='%H %s' HEAD | while IFS= read -r line; do
              echo "- ${line:0:7} ${line:41}"
            done
          } > release-notes.md
          # The phone build is backtalk.apk, which the updater on phones looks for, and the watch
          # build is backtalk-wear.apk, which the updater on watches looks for.
          for build in phone:backtalk.apk wear:backtalk-wear.apk; do
            apk=$(find apks -name "backtalk-${build%%:*}-debug.apk" | head -n 1)
            if [ -z "$apk" ]; then
              echo "The ${build%%:*} APK was not found." >&2
              exit 1
            fi
            cp "$apk" "${build#*:}"
          done
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # A release: the "stable" release, which release builds update from.
            title="Backtalk Remote ${GITHUB_REF_NAME#v} (build $count)"
            tag=stable
            kind=--latest
          else
            title="Development build $count ($short)"
            tag=dev
            kind=--prerelease
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            # Update the release in place. Deleting and creating it again counts as a new release,
            # which notifies everyone watching the repository.
            git tag -f "$tag" "$GITHUB_SHA"
            git push -f origin "refs/tags/$tag"
            gh release upload "$tag" backtalk.apk backtalk-wear.apk --clobber
            gh release edit "$tag" --title "$title" --notes-file release-notes.md $kind
          else
            gh release create "$tag" backtalk.apk backtalk-wear.apk $kind --target "$GITHUB_SHA" --title "$title" --notes-file release-notes.md
          fi
