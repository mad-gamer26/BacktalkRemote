# nginx: the relay's WebSocket and health check, inside the server block of
# the host name apps use as their relay server (with TLS). For example:
#   include /etc/nginx/snippets/backtalk-remote.conf;
location = /backtalk-remote/ws {
    proxy_pass http://127.0.0.1:39860;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # The relay pings every 20 seconds.
    proxy_read_timeout 75s;
    proxy_send_timeout 15s;
    proxy_buffering off;
    access_log off;
}

location = /backtalk-remote/health {
    proxy_pass http://127.0.0.1:39860;
    proxy_set_header X-Real-IP $remote_addr;
}
