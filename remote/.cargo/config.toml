# Android 15 and later run on phones with 16 KB memory pages, which only
# load libraries aligned for them. NDK 27, which Backtalk builds with,
# aligns for 4 KB unless asked (quickjs asks with
# ANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES).
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.armv7-linux-androideabi]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
