// For building the open-source release of TalkBack.

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.android.library) apply false
    alias(libs.plugins.kotlin.compose) apply false
}

apply from: 'shared.gradle'

apply from: 'version.gradle'

final BUILD_TIMESTAMP = new Date().format('yyyy_MM_dd_HHmm')

// Backtalk Remote's release key, when one is configured: from the environment in CI, or from
// local.properties (keystore.file, keystore.password, key.alias, key.password) on your own
// computer. Builds signed with it update each other, development and stable builds alike; without
// it, builds are signed with the computer's debug key.
def releaseKeyProperties = new Properties()
def releaseKeyLocalFile = rootProject.file('local.properties')
if (releaseKeyLocalFile.exists()) {
    releaseKeyLocalFile.withInputStream { releaseKeyProperties.load(it) }
}
def releaseKey = { String env, String property ->
    System.getenv(env) ?: releaseKeyProperties.getProperty(property)
}
def releaseKeystore = releaseKey('BACKTALK_REMOTE_KEYSTORE', 'keystore.file')

dependencies {
    implementation project(':talkback')
}

android {
    namespace = "com.android.talkback"
    defaultConfig {
        applicationId = talkbackApplicationId
        versionCode = backtalkVersionCodeBase + gitCommitCount
        versionName = talkbackVersionName + "-" + BUILD_TIMESTAMP
        minSdk = 26
        targetSdk = 36
        testInstrumentationRunner = 'android.test.InstrumentationTestRunner'
        multiDexEnabled = true
    }
    signingConfigs {
        if (releaseKeystore) {
            backtalkRemote {
                storeFile = file(releaseKeystore)
                storePassword = releaseKey('BACKTALK_REMOTE_KEYSTORE_PASSWORD', 'keystore.password')
                keyAlias = releaseKey('BACKTALK_REMOTE_KEY_ALIAS', 'key.alias')
                keyPassword = releaseKey('BACKTALK_REMOTE_KEY_PASSWORD', 'key.password')
            }
        }
    }
    buildTypes {
        // The published builds are debug builds, signed with the debug key. Android runs a
        // debuggable app without compiling it, which makes navigation several times slower on
        // a watch, so they are not debuggable. Debug logging in the libraries stays on.
        debug {
            debuggable = false
            if (releaseKeystore) {
                signingConfig = signingConfigs.backtalkRemote
            }
        }
    }
    packaging {
        resources {
            excludes += ['LICENSE', 'README']
        }
        jniLibs {
            // On-device AI only runs on arm64-v8a (see OnDeviceAiSettings), so its 26 MB library
            // would never load on x86_64.
            excludes += ['lib/x86_64/liblitertlm_jni.so']
        }
    }
    lint {
        checkReleaseBuilds = false
        // Lint the library modules too, where most of the code is, in one report.
        checkDependencies = true
        // The issues that were already there when lint was added to CI. Only new ones fail the
        // build. To accept new ones on purpose, run ./gradlew updateLintBaselinePhoneDebug.
        baseline = file("lint-baseline.xml")
        abortOnError = true
    }
    productFlavors {
        phone {
            dimension = "target"
        }
        wear {
            dimension = "target"
            versionNameSuffix = "-wear"
        }
    }
}
